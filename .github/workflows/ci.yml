name: CI

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: "11.3.0"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "📝 Checking code format"
        run: pnpm run format:check

      - name: "🧩 Check the generated emoji manifest"
        run: |
          node scripts/generate-emoji-manifest.mjs
          git diff --exit-code -- public/emoji/manifest.json

      - name: "🚀 Build the project"
        run: pnpm run build

  backend:
    name: Backend type-check & tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: backends

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backends/package-lock.json

      - name: "📦 Install dependencies"
        run: npm ci

      - name: "🔎 Type-check"
        run: npm run check

      - name: "🧪 Run tests"
        run: npm test
